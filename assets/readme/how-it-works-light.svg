    <text x="121" y="84" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">Claude Code</text>
    <text x="121" y="110" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">Codex</text>
  </g>
  <g transform="translate(338 156)">
    <rect width="242" height="132" rx="14" fill="#FBF6EC" stroke="#C9B9A0" stroke-width="1.5"/>
    <text x="121" y="48" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" fill="#241A22">black-souls-mcp</text>
    <text x="121" y="84" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">Node.js</text>
    <text x="121" y="110" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">37 tools</text>
  </g>
  <g transform="translate(620 156)">
    <rect width="242" height="132" rx="14" fill="#FBF6EC" stroke="#C9B9A0" stroke-width="1.5"/>
    <text x="121" y="48" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" fill="#241A22">BridgeRuntime/</text>
    <text x="121" y="84" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">inbox · outbox</text>
    <text x="121" y="110" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">state · map</text>
  </g>
  <g transform="translate(902 156)">
    <rect width="242" height="132" rx="14" fill="#FBF6EC" stroke="#C9B9A0" stroke-width="1.5"/>
