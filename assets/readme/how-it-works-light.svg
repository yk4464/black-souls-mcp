  <path d="M 324 314 L 313 321 L 324 328" fill="none" stroke="#6E5016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#241A22">stdio</text>
  <path d="M 606 314 L 595 321 L 606 328" fill="none" stroke="#6E5016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#241A22">outbox/&lt;id&gt;.json</text>
  <path d="M 888 314 L 877 321 L 888 328" fill="none" stroke="#6E5016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="882" y="357" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#241A22">state/*.json ~10/s</text>

  <text x="56" y="410" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="18" fill="#5B5160">no screenshots · no OCR · no mouse</text>
