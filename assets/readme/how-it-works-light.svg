<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">How BLACK SOULS MCP works</title>
  <desc id="desc">Input flows left to right: MCP client over stdio to black-souls-mcp, as inbox/*.cmd files into BridgeRuntime/, then into the game's RGSS3 Input. State flows right to left: Game.exe writes state/*.json about 10 times per second, replies go to outbox/&lt;id&gt;.json, and the server answers the client over stdio. No screenshots, no OCR, no mouse.</desc>

  <rect width="1200" height="440" rx="20" fill="#F4ECDD"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="19.5" fill="none" stroke="#C9B9A0" stroke-width="1.5"/>

  <text x="56" y="64" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#5B5160">INPUT  →</text>
  <text x="1144" y="410" text-anchor="end" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#5B5160">←  STATE</text>

