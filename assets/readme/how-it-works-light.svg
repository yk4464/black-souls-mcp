  <path d="M 952 258 L 952 288 C 952 332 812 332 812 288 L 812 258 L 670 258 L 670 288 C 670 332 530 332 530 288 L 530 258 L 388 258 L 388 288 C 388 332 248 332 248 288 L 248 258" fill="none" stroke="#6E5016" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

