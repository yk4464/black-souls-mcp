    <text x="121" y="84" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">RGSS3 Input</text>
    <text x="121" y="110" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="20" fill="#5B5160">Graphics.update</text>
  </g>

